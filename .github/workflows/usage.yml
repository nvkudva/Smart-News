name: usage

# What today has cost, on demand. Cloudflare's usage lives only in the dashboard
# and in the GraphQL analytics API, and neither is reachable from a phone with
# any comfort — this prints both numbers into a job summary instead.
on:
  workflow_dispatch:

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Not a secret, and already in wrangler.jsonc — see cycle.yml.
      CLOUDFLARE_D1_ID: 1e779125-88d9-4688-85f2-08c3c6bcecf3

    steps:
      - uses: actions/checkout@v5

      # bun, not node: it runs the scripts' TypeScript directly, so there is no
      # tsx transpile between the runner and the work, and it installs in about
      # a third of npm ci's time. Measured on the pipeline's own module graph,
      # startup went 0.57s to 0.17s — four invocations a cycle. web/ already
      # builds this way; this makes the root match.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Frozen: a run installs what the lockfile says and nothing else.
      - run: bun install --frozen-lockfile

      # Into the run's summary as well as its log: the summary is what the
      # mobile app shows without opening a job.
      - name: Read today's usage
        run: |
          {
            echo '```'
            bun run --silent usage
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
