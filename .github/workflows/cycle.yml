name: news cycle

# Every 15 minutes: pull the working set out of D1, fetch and summarise what is
# new, push the results back. The runner has no disk that survives between runs,
# so D1 is the durable copy and the local SQLite file is scratch — see
# scripts/hydrate-d1.ts.
# GitHub drops most firings of a */15 schedule, so the 15-minute clock lives in
# a Cloudflare Worker (deploy/cron-worker) that calls workflow_dispatch instead.
on:
  workflow_dispatch:          # the Worker's trigger, and the Actions tab button

# Two runs sharing one D1 would clobber each other's cluster assignments.
concurrency:
  group: news-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Not a secret: this id is already in wrangler.jsonc in a public repo,
      # and it grants nothing without the API token.
      CLOUDFLARE_D1_ID: 1e779125-88d9-4688-85f2-08c3c6bcecf3
      LLM_PROVIDER: cloudflare
      LLM_MODEL: '@cf/meta/llama-3.2-3b-instruct'
      LLM_RPM: '100'
      LLM_CONCURRENCY: '4'
      SUMMARISE_MIN_SOURCES: '2'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - name: Rebuild the working store from D1
        run: npm run hydrate

      - name: Fetch, cluster, summarise
        run: npm run cycle 40

      - name: Push results back to D1
        run: npm run sync
