name: news cycle

# Every 30 minutes: fetch and summarise what is new, push the results back. D1
# is the durable copy; the local SQLite file is the working set, carried between
# runs in the Actions cache and topped up from D1 rather than rebuilt from it —
# see scripts/hydrate-d1.ts. A cache miss falls back to the full rebuild.
# GitHub drops most firings of a */30 schedule, so the 30-minute clock lives in
# a Cloudflare Worker (deploy/cron-worker) that calls workflow_dispatch instead.
on:
  workflow_dispatch:          # the Worker's trigger, and the Actions tab button

# Two runs sharing one D1 would clobber each other's cluster assignments.
concurrency:
  group: news-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    # Below the 30-minute cron period, not equal to it: at the period itself a slow run is
    # still alive when the Worker dispatches its successor, and the queue that
    # concurrency builds never drains.
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Not a secret: this id is already in wrangler.jsonc in a public repo,
      # and it grants nothing without the API token.
      CLOUDFLARE_D1_ID: 1e779125-88d9-4688-85f2-08c3c6bcecf3
      LLM_PROVIDER: cloudflare
      LLM_MODEL: '@cf/meta/llama-3.2-3b-instruct'
      LLM_RPM: '100'
      LLM_CONCURRENCY: '4'
      SUMMARISE_MIN_SOURCES: '2'
      # Corroborated stories are never capped; this bounds only the
      # single-source queue, which otherwise takes every slot the 150 above
      # leaves - see the note in summarise.ts for where the number comes from.
      SUMMARISE_SINGLE_MAX: '6'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      # The runner's disk does not survive, so the store used to be rebuilt from
      # D1 every cycle: ~14,000 rows a run, and the whole of the pipeline's read
      # cost, to re-download five days of rows of which about fifty had changed.
      # Restoring the previous run's file makes hydrate a top-up instead.
      #
      # The key must be unique per run — a cache entry is immutable, so reusing
      # a key would save nothing after the first time — and restore-keys then
      # picks the newest previous entry. A miss simply pays the old price.
      - name: Restore the working store
        uses: actions/cache/restore@v4
        with:
          path: data/smartnews.db
          key: smartnews-db-${{ github.run_id }}
          restore-keys: smartnews-db-

      - name: Top up the working store from D1
        run: npm run hydrate

      - name: Fetch, cluster, summarise
        run: npm run cycle 150

      # The runner's disk is scratch, so a failed sync throws away everything
      # the summarise step just paid Workers AI for, and the next run starts
      # again from D1's older state. It is the one step worth retrying.
      - name: Push results back to D1
        run: npm run sync || (sleep 20 && npm run sync)

      # Saved after the push, so a run that failed to sync does not hand its
      # unpushed state to the next one as if it were D1's. The dirty list rides
      # along in the file, so anything this run could not push goes up next time.
      - name: Save the working store
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/smartnews.db
          key: smartnews-db-${{ github.run_id }}

      # A cycle that dies silently looks exactly like a quiet news day. The
      # stamp sync already writes is the liveness signal; this turns a stall
      # into a failed run on the Actions tab rather than a feed nobody notices
      # has stopped moving.
      - name: Fail loudly if the cycle went nowhere
        if: failure()
        run: echo "::error::news cycle failed — the feed is now as stale as its last successful sync"
